<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Lens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="page">
    <section class="hero card">
      <p class="eyebrow">Interactive Utility</p>
      <h1>Age Lens</h1>
      <p class="subtitle">Enter a date of birth and instantly calculate age. Every calculation is stored and shown below.</p>
    </section>

    <section class="calculator card">
      <form id="ageForm" class="form-grid">
        <label for="dob">Date of Birth</label>
        <input id="dob" name="dob" type="date" required max="9999-12-31">
        <button type="submit">Calculate Age</button>
      </form>
      <p id="message" class="message" aria-live="polite"></p>
      <div id="result" class="result hidden" aria-live="polite"></div>
    </section>

    <section class="history card">
      <div class="history-head">
        <h2>Recent Calculations</h2>
        <button id="refreshBtn" type="button" class="ghost">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>DOB</th>
              <th>Age</th>
              <th>Calculated At</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="3" class="empty">No calculations yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
