{% extends 'base.html' %}
{% block title %}Register | Zeenkaar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="mb-3">Create Account</h2>
    <form method="post" class="card card-body shadow-sm auth-card" aria-label="Registration form">
      <div class="mb-3">
        <label class="form-label" for="full_name">Full Name</label>
        <input id="full_name" type="text" name="full_name" autocomplete="name" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" class="form-control" required />
      </div>
      <button class="btn btn-brand" type="submit">Register</button>
    </form>
  </div>
</div>
{% endblock %}
