{% extends 'base.html' %}
{% block title %}Login | Zeenkaar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="mb-3">Login</h2>
    <form method="post" class="card card-body shadow-sm auth-card" aria-label="Login form">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" class="form-control" required />
      </div>
      <button class="btn btn-brand" type="submit">Login</button>
    </form>
  </div>
</div>
{% endblock %}
