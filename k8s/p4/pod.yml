apiVersion: apps/v1
kind: Deployment
metadata:
  name: diet-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diet
  template:
    metadata:
      labels:
        app: diet
    spec:
      containers:
      - name: diet
        image: ayeshactn/dietmanager
        ports:
        - containerPort: 5001
