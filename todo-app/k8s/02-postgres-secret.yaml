# DO NOT commit real passwords here.
# The CI/CD pipeline creates this secret via kubectl.
# This file is for documentation only.
#
# Created by GitHub Actions with:
#   kubectl create secret generic postgres-secret \
#     --namespace todo \
#     --from-literal=postgres-user=todouser \
#     --from-literal=postgres-password=<from-github-secret> \
#     --from-literal=postgres-db=tododb \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: todo
type: Opaque
stringData:
  postgres-user: "REPLACED_BY_CI"
  postgres-password: "REPLACED_BY_CI"
  postgres-db: "tododb"
