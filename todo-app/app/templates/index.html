<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0ece4;
      --paper: #faf8f4;
      --ink: #1c1a16;
      --muted: #9a9080;
      --border: #ddd8ce;
      --accent: #e84c1e;
      --accent2: #2d6a4f;
      --accent3: #d4a017;
      --low: #2d6a4f;
      --med: #d4a017;
      --high: #e84c1e;
      --shadow: rgba(28,26,22,0.1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(232,76,30,0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(45,106,79,0.04) 0%, transparent 50%);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--ink);
      color: var(--bg);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 2px;
      line-height: 1;
    }
    .logo span { color: var(--accent); }

    .logo-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: rgba(240,236,228,0.35);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: rgba(240,236,228,0.06);
      border: 1px solid rgba(240,236,228,0.1);
      border-radius: 12px;
      padding: 14px 12px;
    }
    .stat-box.full { grid-column: 1 / -1; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      line-height: 1;
      color: var(--accent);
    }
    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(240,236,228,0.35);
      margin-top: 3px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(240,236,228,0.3);
      margin-bottom: 8px;
      padding-left: 12px;
    }
    .filter-btn {
      background: none;
      border: none;
      color: rgba(240,236,228,0.5);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 400;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .filter-btn:hover { color: white; background: rgba(240,236,228,0.08); }
    .filter-btn.active {
      color: white;
      background: rgba(232,76,30,0.2);
      border-left: 2px solid var(--accent);
    }
    .filter-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      background: rgba(240,236,228,0.1);
      padding: 2px 7px;
      border-radius: 100px;
    }

    .clear-btn {
      margin-top: auto;
      background: rgba(232,76,30,0.1);
      border: 1px solid rgba(232,76,30,0.3);
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clear-btn:hover { background: rgba(232,76,30,0.2); }

    /* ── Main ── */
    .main {
      padding: 40px;
      max-width: 800px;
    }

    .main-header {
      margin-bottom: 32px;
    }
    .main-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 2px;
      line-height: 1;
    }
    .main-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Add todo form ── */
    .add-form {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 2px 20px var(--shadow);
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-title {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }
    .input-title:focus { border-color: var(--accent); }
    .input-title::placeholder { color: var(--muted); }

    .input-desc {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--ink);
      outline: none;
      resize: none;
      height: 60px;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .input-desc:focus { border-color: var(--accent); }
    .input-desc::placeholder { color: var(--muted); }

    .form-bottom {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      color: var(--ink);
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    .add-btn {
      margin-left: auto;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }
    .add-btn:hover { background: #d03e10; transform: translateY(-1px); }
    .add-btn:active { transform: translateY(0); }

    /* ── Todo list ── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .list-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: all 0.2s;
      animation: slide-in 0.25s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .todo-item:hover { border-color: #ccc5b8; box-shadow: 0 4px 16px var(--shadow); }
    .todo-item.completed { opacity: 0.55; }

    .todo-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-size: 0.7rem;
      color: white;
    }
    .todo-check:hover { border-color: var(--accent); }
    .todo-check.checked {
      background: var(--accent2);
      border-color: var(--accent2);
    }

    .todo-body { flex: 1; min-width: 0; }

    .todo-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .todo-title.done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .todo-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 100px;
      font-weight: 500;
    }
    .badge-low { background: rgba(45,106,79,0.12); color: var(--low); }
    .badge-medium { background: rgba(212,160,23,0.12); color: var(--med); }
    .badge-high { background: rgba(232,76,30,0.12); color: var(--high); }
    .badge-cat {
      background: rgba(28,26,22,0.06);
      color: var(--muted);
    }

    .todo-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      margin-left: auto;
    }

    .todo-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      transition: all 0.15s;
    }
    .action-btn:hover { color: var(--accent); background: rgba(232,76,30,0.08); }
    .action-btn.delete:hover { color: var(--accent); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }
    .empty h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: var(--ink);
      margin-bottom: 6px;
      opacity: 0.3;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 100px;
      transition: width 0.5s ease;
    }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: static; }
      .main { padding: 24px 16px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="logo">Task<span>Flow</span></div>
      <div class="logo-sub">Flask + PostgreSQL + K8s</div>
    </div>

    <div class="stats-grid">
      <div class="stat-box full">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-active" style="color:#d4a017">0</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-done" style="color:#2d6a4f">0</div>
        <div class="stat-label">Done</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Filter</div>
      <button class="filter-btn active" onclick="setFilter('all')" id="f-all">
        All Tasks <span class="filter-count" id="fc-all">0</span>
      </button>
      <button class="filter-btn" onclick="setFilter('active')" id="f-active">
        Active <span class="filter-count" id="fc-active">0</span>
      </button>
      <button class="filter-btn" onclick="setFilter('completed')" id="f-completed">
        Completed <span class="filter-count" id="fc-completed">0</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Category</div>
      <button class="filter-btn active" onclick="setCategory('')" id="cat-all">All</button>
      <button class="filter-btn" onclick="setCategory('General')" id="cat-General">General</button>
      <button class="filter-btn" onclick="setCategory('Work')" id="cat-Work">Work</button>
      <button class="filter-btn" onclick="setCategory('Personal')" id="cat-Personal">Personal</button>
      <button class="filter-btn" onclick="setCategory('Shopping')" id="cat-Shopping">Shopping</button>
      <button class="filter-btn" onclick="setCategory('Health')" id="cat-Health">Health</button>
    </div>

    <button class="clear-btn" onclick="clearCompleted()">Clear Completed</button>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-header">
      <h1 class="main-title">My Tasks</h1>
      <div class="main-date" id="today-date"></div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Progress</span>
        <span id="progress-text">0 of 0 completed</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Add form -->
    <div class="add-form">
      <div class="form-row">
        <input
          type="text"
          class="input-title"
          id="input-title"
          placeholder="What needs to be done?"
          onkeydown="if(event.key==='Enter') addTodo()"
        />
      </div>
      <textarea
        class="input-desc"
        id="input-desc"
        placeholder="Add a description (optional)..."
      ></textarea>
      <div class="form-bottom">
        <select id="input-priority">
          <option value="low">Low Priority</option>
          <option value="medium" selected>Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        <select id="input-category">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Shopping">Shopping</option>
          <option value="Health">Health</option>
        </select>
        <button class="add-btn" onclick="addTodo()">+ Add Task</button>
      </div>
    </div>

    <!-- List -->
    <div class="list-header">
      <span class="list-title" id="list-label">All Tasks</span>
    </div>

    <div class="todo-list" id="todo-list">
      <div class="empty">
        <div class="empty-icon">📋</div>
        <h3>No Tasks Yet</h3>
        <p>Add your first task above</p>
      </div>
    </div>
  </main>
</div>

<script>
  let currentFilter = 'all';
  let currentCategory = '';

  // Set today's date
  const now = new Date();
  document.getElementById('today-date').textContent =
    now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  async function loadTodos() {
    let url = '/api/todos';
    const params = new URLSearchParams();
    if (currentFilter !== 'all') params.set('filter', currentFilter);
    if (currentCategory) params.set('category', currentCategory);
    if (params.toString()) url += '?' + params;

    const res = await fetch(url);
    const todos = await res.json();
    renderTodos(todos);
    await loadStats();
  }

  async function loadStats() {
    const res = await fetch('/api/stats');
    const s = await res.json();
    document.getElementById('stat-total').textContent = s.total;
    document.getElementById('stat-active').textContent = s.active;
    document.getElementById('stat-done').textContent = s.completed;
    document.getElementById('fc-all').textContent = s.total;
    document.getElementById('fc-active').textContent = s.active;
    document.getElementById('fc-completed').textContent = s.completed;
    const pct = s.total > 0 ? Math.round((s.completed / s.total) * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent =
      `${s.completed} of ${s.total} completed`;
  }

  function renderTodos(todos) {
    const list = document.getElementById('todo-list');
    if (!todos.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">✅</div>
          <h3>All Clear</h3>
          <p>No tasks here</p>
        </div>`;
      return;
    }
    list.innerHTML = todos.map(t => `
      <div class="todo-item ${t.completed ? 'completed' : ''}" id="todo-${t.id}">
        <div class="todo-check ${t.completed ? 'checked' : ''}"
             onclick="toggleTodo(${t.id}, ${!t.completed})">
          ${t.completed ? '✓' : ''}
        </div>
        <div class="todo-body">
          <div class="todo-title ${t.completed ? 'done' : ''}">${escHtml(t.title)}</div>
          ${t.description ? `<div class="todo-desc">${escHtml(t.description)}</div>` : ''}
          <div class="todo-meta">
            <span class="badge badge-${t.priority}">${t.priority}</span>
            <span class="badge badge-cat">${t.category}</span>
            <span class="todo-time">${formatDate(t.created_at)}</span>
          </div>
        </div>
        <div class="todo-actions">
          <button class="action-btn delete" onclick="deleteTodo(${t.id})" title="Delete">✕</button>
        </div>
      </div>
    `).join('');
  }

  async function addTodo() {
    const title = document.getElementById('input-title').value.trim();
    if (!title) {
      document.getElementById('input-title').focus();
      return;
    }
    await fetch('/api/todos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        description: document.getElementById('input-desc').value.trim(),
        priority: document.getElementById('input-priority').value,
        category: document.getElementById('input-category').value
      })
    });
    document.getElementById('input-title').value = '';
    document.getElementById('input-desc').value = '';
    loadTodos();
  }

  async function toggleTodo(id, completed) {
    await fetch(`/api/todos/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ completed })
    });
    loadTodos();
  }

  async function deleteTodo(id) {
    await fetch(`/api/todos/${id}`, { method: 'DELETE' });
    loadTodos();
  }

  async function clearCompleted() {
    await fetch('/api/todos/clear-completed', { method: 'DELETE' });
    loadTodos();
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('[id^="f-"]').forEach(b => b.classList.remove('active'));
    document.getElementById('f-' + f).classList.add('active');
    const labels = { all: 'All Tasks', active: 'Active Tasks', completed: 'Completed Tasks' };
    document.getElementById('list-label').textContent = labels[f];
    loadTodos();
  }

  function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('[id^="cat-"]').forEach(b => b.classList.remove('active'));
    document.getElementById('cat-' + (cat || 'all')).classList.add('active');
    loadTodos();
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  loadTodos();
</script>
</body>
</html>
