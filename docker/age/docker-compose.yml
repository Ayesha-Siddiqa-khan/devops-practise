services:
  db:
    image: postgres:16-alpine
    container_name: age_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

  age_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: age_app
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: mydb
      DB_USER: myuser
      DB_PASSWORD: mypass
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    container_name: age_nginx
    restart: unless-stopped
    depends_on:
      - age_app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/static:ro
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
