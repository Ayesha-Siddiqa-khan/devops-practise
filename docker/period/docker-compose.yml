services:
  femcare-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: femcare-ai
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://femcare:femcare@db:5432/femcare
      - SECRET_KEY=change-this-secret
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@femcare.ai
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./:/app
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: femcare-postgres
    environment:
      - POSTGRES_DB=femcare
      - POSTGRES_USER=femcare
      - POSTGRES_PASSWORD=femcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
